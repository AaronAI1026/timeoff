<style>
  /* Committed single-theme design: Sunburn black + orange.
     Painted explicitly so it holds on any host ground. */
  :root{
    --bg:#0C0B0A; --surface:#151312; --surface2:#211E1B;
    --ink:#F6F1EA; --muted:#A2988C; --line:#262220; --line2:#38322C;
    --accent:#F04E23; --accent-ink:#160804; --accent-soft:#381309; --accent-soft-ink:#FF9C72;
    --good:#4CC38A; --good-soft:#132A1E; --good-soft-ink:#82E0B4;
    --bad:#FF6A4D; --bad-soft:#341410; --bad-soft-ink:#FFA48F;
    --warn:#F5A524; --warn-soft:#2E2108; --warn-soft-ink:#FFCE73;
    --pto:#3FBFDA; --pto-soft:#0E272E; --pto-soft-ink:#8ADCEE;
    --uto:#A794E8; --uto-soft:#221D33; --uto-soft-ink:#CDC2F2;
    --shadow:inset 0 1px 0 rgba(255,255,255,.03), 0 8px 28px rgba(0,0,0,.45);
    --focus:#F04E23;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--ink);
    font-family:"Manrope", "Segoe UI", system-ui, sans-serif;
    font-size:15px; line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3{font-family:"Archivo","Manrope",system-ui,sans-serif; text-wrap:balance; margin:0}
  button{font:inherit; cursor:pointer}
  button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible{
    outline:2px solid var(--focus); outline-offset:2px; border-radius:6px;
  }
  input,select,textarea{
    font:inherit; color:var(--ink); background:var(--surface);
    border:1px solid var(--line2); border-radius:8px; padding:9px 11px; width:100%;
  }
  textarea{resize:vertical; min-height:70px}
  label{font-weight:600; font-size:13px; display:block; margin-bottom:5px}
  .hint{font-size:12.5px; color:var(--muted); font-weight:400}

  /* ---------- shell ---------- */
  .topbar{
    position:sticky; top:0; z-index:40;
    background:rgba(12,11,10,.88);
    backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
    border-bottom:1px solid var(--line);
    padding:9px 16px;
    display:flex; align-items:center; gap:10px;
  }
  .brand{display:flex; align-items:center; gap:11px; min-width:0; overflow:hidden}
  .brand > div{min-width:0}
  .logochip{height:42px; flex:none; background:#FFFFFF; border-radius:10px;
    padding:4px 9px; display:flex; align-items:center}
  .logochip img{height:100%; width:auto; display:block}
  .brand h1{font-size:19px; font-weight:900; letter-spacing:.015em; white-space:nowrap;
    overflow:hidden; text-overflow:ellipsis; text-transform:uppercase}
  .brand h1 .to{color:var(--accent)}
  .brand .sub{font-size:10.5px; color:var(--muted); text-transform:uppercase; letter-spacing:.14em; font-weight:700; margin-top:-1px}
  .topbar .spacer{flex:1}
  .idbtn{
    display:flex; align-items:center; gap:7px; max-width:44vw;
    border:1px solid var(--line2); background:var(--surface); color:var(--ink);
    border-radius:999px; padding:5px 12px 5px 6px; font-weight:600; font-size:13.5px;
  }
  .avatar{width:26px;height:26px;border-radius:50%; background:var(--accent-soft); color:var(--accent-soft-ink);
    display:inline-flex; align-items:center; justify-content:center; font-weight:700; font-size:12px; flex:none}
  .idbtn .nm{overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .bellbtn{position:relative; border:1px solid var(--line2); background:var(--surface); color:var(--ink);
    border-radius:999px; width:38px;height:38px; display:inline-flex; align-items:center; justify-content:center; flex:none}
  .bellbtn svg{width:19px;height:19px}
  .bellbadge{position:absolute; top:-4px; right:-4px; background:var(--bad); color:#fff;
    font-size:10.5px; font-weight:700; border-radius:999px; min-width:17px; height:17px; line-height:17px;
    text-align:center; padding:0 4px}

  .mgrchip{font-size:10.5px; font-weight:700; letter-spacing:.06em; text-transform:uppercase;
    background:var(--accent-soft); color:var(--accent-soft-ink); border-radius:5px; padding:2px 6px; flex:none}

  .tabs{
    position:sticky; top:54px; z-index:39;
    display:flex; gap:4px; padding:8px 12px;
    background:rgba(12,11,10,.88);
    backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
    border-bottom:1px solid var(--line); overflow-x:auto; scrollbar-width:none;
  }
  .tabs::-webkit-scrollbar{display:none}
  .tab{
    border:0; background:transparent; color:var(--muted); font-weight:700; font-size:14px;
    padding:7px 14px; border-radius:999px; white-space:nowrap;
  }
  .tab[aria-selected="true"]{background:var(--accent); color:var(--accent-ink)}
  .tab[aria-selected="true"] .cnt{background:rgba(0,0,0,.28); color:#FFE7D8}
  .tab .cnt{font-size:11.5px; font-weight:700; background:var(--warn-soft); color:var(--warn-soft-ink);
    border-radius:999px; padding:1px 6px; margin-left:4px}

  main{max-width:860px; margin:0 auto; padding:16px 14px 90px}

  .card{background:var(--surface); border:1px solid var(--line); border-radius:16px;
    box-shadow:var(--shadow); padding:16px; margin-bottom:14px}
  .card h2{font-size:17px; font-weight:700; margin-bottom:2px}
  .card .lead{color:var(--muted); font-size:13.5px; margin:0 0 14px}

  .banner{border-radius:10px; padding:10px 13px; font-size:13.5px; margin-bottom:14px;
    display:flex; gap:9px; align-items:flex-start}
  .banner.warn{background:var(--warn-soft); color:var(--warn-soft-ink)}
  .banner.info{background:var(--pto-soft); color:var(--pto-soft-ink)}
  .banner.bad{background:var(--bad-soft); color:var(--bad-soft-ink)}
  .banner b{font-weight:700}

  .grid2{display:grid; grid-template-columns:1fr 1fr; gap:12px}
  @media (max-width:540px){ .grid2{grid-template-columns:1fr} }
  .field{margin-bottom:13px}

  .seg{display:flex; border:1px solid var(--line2); border-radius:9px; overflow:hidden}
  .seg button{flex:1; border:0; background:var(--surface); color:var(--muted); padding:9px 6px; font-weight:600; font-size:13.5px}
  .seg button+button{border-left:1px solid var(--line2)}
  .seg button[aria-pressed="true"]{background:var(--accent-soft); color:var(--accent-soft-ink)}
  .seg button:disabled{opacity:.45; cursor:not-allowed}

  .btn{border:0; border-radius:9px; padding:10px 16px; font-weight:700; font-size:14.5px}
  .btn.primary{background:var(--accent); color:var(--accent-ink)}
  .btn.primary:hover{filter:brightness(1.08); box-shadow:0 4px 20px rgba(240,78,35,.35)}
  .btn.quiet{background:var(--surface2); color:var(--ink)}
  .btn.good{background:var(--good); color:#07150D}
  .btn.bad{background:var(--bad); color:#1E0602}
  .btn.sm{padding:6px 11px; font-size:13px; border-radius:7px}
  .btn:disabled{opacity:.5; cursor:not-allowed}
  .linkbtn{border:0; background:none; color:var(--accent-soft-ink); font-weight:600; font-size:13px; padding:2px 4px; text-decoration:underline}

  /* ---------- chips / pills ---------- */
  .pill{display:inline-flex; align-items:center; gap:4px; font-size:11.5px; font-weight:700;
    border-radius:999px; padding:2px 9px; letter-spacing:.02em}
  .pill.pending{background:var(--warn-soft); color:var(--warn-soft-ink)}
  .pill.approved{background:var(--good-soft); color:var(--good-soft-ink)}
  .pill.denied{background:var(--bad-soft); color:var(--bad-soft-ink)}
  .pill.cancelled{background:var(--surface2); color:var(--muted)}
  .pill.lead{background:var(--accent-soft); color:var(--accent-soft-ink)}
  .pill.bud{background:var(--surface2); color:var(--muted)}
  .pill.pto{background:var(--pto-soft); color:var(--pto-soft-ink)}
  .pill.uto{background:var(--uto-soft); color:var(--uto-soft-ink)}
  .pill.open{background:var(--pto-soft); color:var(--pto-soft-ink)}
  .pill.claimed{background:var(--good-soft); color:var(--good-soft-ink)}
  .pill.flag{background:var(--bad-soft); color:var(--bad-soft-ink)}

  /* ---------- request rows ---------- */
  .req{border:1px solid var(--line); border-radius:11px; padding:11px 13px; margin-bottom:9px; background:var(--surface)}
  .req.mine{border-color:var(--accent); border-width:1.5px}
  .req .top{display:flex; align-items:center; gap:8px; flex-wrap:wrap}
  .req .who{font-weight:700; font-size:14.5px}
  .req .dates{font-size:13.5px; color:var(--muted); font-variant-numeric:tabular-nums; margin-top:2px}
  .req .reason{font-size:13.5px; margin-top:5px; color:var(--ink)}
  .req .meta{font-size:12px; color:var(--muted); margin-top:5px}
  .req .acts{display:flex; gap:7px; margin-top:9px; flex-wrap:wrap; align-items:center}
  .req .notebox{margin-top:9px}
  .sechead{display:flex; align-items:center; gap:8px; margin:20px 0 9px}
  .sechead h3{font-size:13px; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); font-weight:700}
  .sechead .n{font-size:12px; font-weight:700; color:var(--muted)}
  .filters{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:4px}
  .fchip{border:1px solid var(--line2); background:var(--surface); color:var(--muted);
    border-radius:999px; padding:4px 12px; font-size:13px; font-weight:600}
  .fchip[aria-pressed="true"]{background:var(--ink); color:var(--bg); border-color:var(--ink)}

  /* ---------- calendar ---------- */
  .calhead{display:flex; align-items:center; gap:8px; margin-bottom:10px}
  .calhead h2{font-size:18px; flex:1}
  .navbtn{border:1px solid var(--line2); background:var(--surface); color:var(--ink);
    border-radius:8px; width:34px; height:34px; font-size:16px; font-weight:700}
  .calgrid{display:grid; grid-template-columns:repeat(7,1fr); gap:4px}
  .dow{font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:.05em;
    color:var(--muted); text-align:center; padding:4px 0}
  .day{
    min-height:74px; border:1px solid var(--line); border-radius:9px; background:var(--surface);
    padding:4px 4px 5px; text-align:left; display:flex; flex-direction:column; gap:2px;
    font:inherit; color:var(--ink); position:relative;
  }
  .day.out{opacity:.38}
  .day.today{border-color:var(--accent); border-width:1.5px}
  .day .dn{font-size:11.5px; font-weight:700; font-variant-numeric:tabular-nums; display:flex; align-items:center; gap:3px}
  .day.hot .dn::after{content:"⚠"; color:var(--bad); font-size:11px}
  .day.hot{background:var(--bad-soft)}
  .day .chip{
    font-size:10px; font-weight:600; border-radius:4px; padding:1px 4px; overflow:hidden;
    white-space:nowrap; text-overflow:ellipsis; max-width:100%;
  }
  .chip.st-pending{background:var(--warn-soft); color:var(--warn-soft-ink)}
  .chip.st-approved{background:var(--good-soft); color:var(--good-soft-ink)}
  .chip.sh{background:var(--pto-soft); color:var(--pto-soft-ink)}
  .day .more{font-size:9.5px; color:var(--muted); font-weight:700}
  .legend{display:flex; gap:12px; flex-wrap:wrap; margin-top:10px; font-size:12px; color:var(--muted)}
  .legend span{display:inline-flex; align-items:center; gap:5px}
  .dotp{width:10px;height:10px;border-radius:3px;background:var(--warn-soft);border:1px solid var(--warn)}
  .dota{width:10px;height:10px;border-radius:3px;background:var(--good-soft);border:1px solid var(--good)}
  .dots{width:10px;height:10px;border-radius:3px;background:var(--pto-soft);border:1px solid var(--pto)}
  .doth{width:10px;height:10px;border-radius:3px;background:var(--bad-soft);border:1px solid var(--bad)}

  /* ---------- schedule ---------- */
  .schedwrap{overflow-x:auto; border:1px solid var(--line); border-radius:12px; background:var(--surface)}
  table.sched{border-collapse:collapse; width:100%; min-width:780px; font-size:12.5px; font-variant-numeric:tabular-nums}
  .sched th, .sched td{padding:8px 9px; border-bottom:1px solid var(--line); text-align:center; white-space:nowrap}
  .sched tbody tr:last-child td{border-bottom:0}
  .sched thead th{background:var(--surface2); font-size:10.5px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted)}
  .sched td:first-child, .sched th:first-child{text-align:left; position:sticky; left:0; background:var(--surface); border-right:1px solid var(--line)}
  .sched thead th:first-child{background:var(--surface2)}
  .sched .nm{font-weight:700; font-size:13px}
  .sched .rl{font-size:10.5px; color:var(--muted)}
  .sched td.cell-off{color:var(--muted); font-style:italic}
  .sched td.cell-to{background:var(--warn-soft); color:var(--warn-soft-ink); font-weight:600}
  .sched td.col-today:not(:first-child), .sched th.col-today{box-shadow:inset 0 0 0 999px rgba(240,78,35,.10)}
  .sched th.col-today{color:var(--accent-soft-ink)}
  .schedmeta{display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin:10px 2px 0; font-size:12px; color:var(--muted)}

  /* ---------- shifts ---------- */
  .shift{border:1px solid var(--line); border-radius:11px; padding:11px 13px; margin-bottom:9px; background:var(--surface)}
  .shift .top{display:flex; align-items:center; gap:8px; flex-wrap:wrap}
  .shift .t{font-weight:700; font-variant-numeric:tabular-nums}

  /* ---------- panels ---------- */
  .overlay{position:fixed; inset:0; background:rgba(0,0,0,.62); z-index:60; display:flex;
    align-items:flex-end; justify-content:center}
  @media (min-width:600px){ .overlay{align-items:center} }
  .sheet{background:var(--surface); border-radius:16px 16px 0 0; width:100%; max-width:560px;
    max-height:82vh; overflow-y:auto; padding:18px 18px 24px; border:1px solid var(--line)}
  @media (min-width:600px){ .sheet{border-radius:16px} }
  .sheet h2{font-size:17px; margin-bottom:10px}
  .sheet .close{float:right; border:0; background:var(--surface2); color:var(--ink);
    border-radius:999px; width:30px; height:30px; font-size:15px; font-weight:700}

  .notif{display:flex; gap:10px; padding:10px 2px; border-bottom:1px solid var(--line); font-size:13.5px}
  .notif:last-child{border-bottom:0}
  .notif .ic{flex:none; width:30px; height:30px; border-radius:8px; display:flex; align-items:center;
    justify-content:center; font-size:14px}
  .notif.unread{font-weight:600}
  .notif .when{color:var(--muted); font-size:11.5px; font-weight:400; margin-top:1px}
  .ic.approved{background:var(--good-soft)} .ic.denied{background:var(--bad-soft)}
  .ic.request{background:var(--warn-soft)} .ic.shift{background:var(--pto-soft)}

  .toasts{position:fixed; bottom:14px; left:50%; transform:translateX(-50%); z-index:80;
    display:flex; flex-direction:column; gap:8px; width:min(420px, 92vw)}
  .toast{background:var(--ink); color:var(--bg); border-radius:10px; padding:11px 15px;
    font-size:13.5px; font-weight:600; box-shadow:var(--shadow); animation:pop .18s ease-out}
  @keyframes pop{from{transform:translateY(8px); opacity:0} to{transform:none; opacity:1}}
  @media (prefers-reduced-motion: reduce){ .toast{animation:none} }

  .empty{color:var(--muted); font-size:13.5px; padding:14px 4px; text-align:center}
  .mgrtools{display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-top:8px}
  details.past summary{cursor:pointer; font-size:13px; color:var(--muted); font-weight:600; padding:6px 0}
</style>

   Sunburn Time Off — shared team app (Firebase edition)
   Data lives in Cloud Firestore; the team uses it with no account

   - requests/<id>    : anyone on the team can create; author can cancel

// ---------- tiny utils ----------
const $  = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
function esc(s){
  return String(s == null ? "" : s)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;").replace(/'/g,"&#39;");
}
function lsGet(k, fallback){
  try{ const v = localStorage.getItem(k); return v == null ? fallback : JSON.parse(v); }
  catch(e){ return fallback; }
}
function lsSet(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
function uid(){
  try{ return crypto.randomUUID().replace(/-/g,""); }
  catch(e){ return "id" + Date.now().toString(36) + Math.random().toString(36).slice(2,10); }
}
const DATE_RE = /^\d{4}-\d{2}-\d{2}$/;
function todayStr(){
  const d = new Date();
  return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
}
function parseDate(s){ // local-time date from YYYY-MM-DD
  if(!DATE_RE.test(String(s))) return null;
  const [y,m,d] = s.split("-").map(Number);
  const dt = new Date(y, m-1, d);
  return isNaN(dt.getTime()) ? null : dt;
}
function dstr(dt){
  return dt.getFullYear() + "-" + String(dt.getMonth()+1).padStart(2,"0") + "-" + String(dt.getDate()).padStart(2,"0");
}
function expandDays(start, end, cap){
  const out = [];
  let a = parseDate(start), b = parseDate(end);
  if(!a || !b) return out;
  cap = cap || 62;
  while(a <= b && out.length < cap){ out.push(dstr(a)); a.setDate(a.getDate()+1); }
  return out;
}
const MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];
function fmtDay(s){
  const d = parseDate(s);
  if(!d) return String(s);
  return d.toLocaleDateString(undefined, {weekday:"short", month:"short", day:"numeric"});
}
function fmtRange(r){
  let part = "";
  if(r.dayPart === "am") part = " · morning half";
  else if(r.dayPart === "pm") part = " · afternoon half";
  else if(r.dayPart === "half") part = " · half day";
  else if(r.dayPart === "custom" && TIME_RE.test(String(r.fromTime||"")) && TIME_RE.test(String(r.toTime||"")))
    part = " · " + fmtTime(r.fromTime) + "–" + fmtTime(r.toTime);
  if(r.start === r.end) return fmtDay(r.start) + part;
  return fmtDay(r.start) + " – " + fmtDay(r.end);
}
function ago(iso){
  const t = Date.parse(iso); if(isNaN(t)) return "";
  const s = Math.max(0, (Date.now()-t)/1000);
  if(s < 60) return "just now";
  if(s < 3600) return Math.floor(s/60) + "m ago";
  if(s < 86400) return Math.floor(s/3600) + "h ago";
  return Math.floor(s/86400) + "d ago";
}
function initials(name){
  const p = String(name||"").trim().split(/\s+/).filter(Boolean);
  if(!p.length) return "?";
  return (p[0][0] + (p.length>1 ? p[p.length-1][0] : "")).toUpperCase();
}
function firstName(name){ return String(name||"").trim().split(/\s+/)[0] || "?"; }
function cleanName(s){ return String(s||"").replace(/\s+/g," ").trim().slice(0,40); }
function cleanText(s, max){ return String(s||"").trim().slice(0, max||300); }
const TIME_RE = /^([01]?\d|2[0-3]):([0-5]\d)$/;
function fmtTime(t){
  if(!TIME_RE.test(String(t||""))) return String(t||"");
  let [h,m] = t.split(":").map(Number);
  const ap = h >= 12 ? "PM" : "AM";
  h = h % 12 || 12;
  return h + ":" + String(m).padStart(2,"0") + " " + ap;
}

let schedules = [];          // published schedules, one per week, sorted by weekStart
let selSchedWeek = null;     // week the viewer is looking at (null = auto)
let dayCounts = {};          // shared per-day time-off counts (meta/daycounts)
let unsubs = [];             // live subscription teardown handles
let healT = null;
let schedDraft = null;       // manager's in-progress textarea edits
let schedWeekDraft = null;
let schedEditorOpen = false;
function addDaysStr(ds, n){
  const d = parseDate(ds); if(!d) return ds;
  d.setDate(d.getDate() + n);
  return dstr(d);
}
function weekScheduleFor(ds){ // the published schedule whose week contains this date
  return schedules.find(s => s.weekStart <= ds && ds <= addDaysStr(s.weekStart, 6)) || null;
}
function defaultSchedWeek(){
  const t = todayStr();
  const cur = weekScheduleFor(t);
  if(cur) return cur.weekStart;
  const up = schedules.find(s => s.weekStart > t);
  if(up) return up.weekStart;
  return schedules.length ? schedules[schedules.length - 1].weekStart : EMBEDDED_SCHEDULE.weekStart;
}
function currentSchedule(){
  if(!schedules.length) return EMBEDDED_SCHEDULE;
  const w = selSchedWeek || defaultSchedWeek();
  return schedules.find(s => s.weekStart === w) || schedules[schedules.length - 1];
}
function schedCellKind(cell){
  const c = String(cell||"").trim().toLowerCase();
  if(!c || c === "off") return "off";
  if(c === "time off" || c === "timeoff" || c === "pto") return "to";
  return "shift";
}
function serializeSchedule(s){
  return (s.rows||[]).slice(0,60).map(r =>
    [r.name, r.role].concat((Array.isArray(r.shifts)?r.shifts:[]).slice(0,7)).join(" | ")
  ).join("\n");
}
function scheduledFor(ds){
  const s = weekScheduleFor(ds) || (!schedules.length ? EMBEDDED_SCHEDULE : null);
  if(!s) return null;
  const ws = parseDate(s.weekStart), d = parseDate(ds);
  if(!ws || !d) return null;
  const idx = Math.round((d - ws) / 86400000);
  if(idx < 0 || idx > 6) return null;
  return (s.rows||[]).slice(0,60)
    .map(r => ({ name: r.name, role: r.role, cell: String((Array.isArray(r.shifts)?r.shifts:[])[idx] || "").trim() }))
    .filter(x => schedCellKind(x.cell) === "shift");
}

// ---------- offline fallback store (this device only) ----------
function makeLocalDb(){
  const KEY = "sto.localdata";
  const data = lsGet(KEY, { requests:{}, decisions:{}, shifts:{}, settings:{} });
  const listeners = {};
  function save(){ lsSet(KEY, data); }
  function snap(col){
    const docs = Object.keys(data[col]||{}).sort().map(id => ({
      id, exists:true, data: () => data[col][id],
      metadata:{fromCache:false, hasPendingWrites:false}
    }));
    return { docs, size:docs.length, empty:!docs.length, docChanges:()=>[], metadata:{fromCache:false, hasPendingWrites:false} };
  }
  function emit(col){ (listeners[col]||[]).forEach(fn => { try{ fn(snap(col)); }catch(e){} }); }
  function docRef(col, id){
    return {
      id, path: col + "/" + id,
      async get(){ const d = (data[col]||{})[id];
        return { id, exists: d !== undefined, data: () => d, metadata:{fromCache:false, hasPendingWrites:false} }; },
      async set(d){ (data[col] = data[col]||{})[id] = JSON.parse(JSON.stringify(d)); save(); emit(col); },
      async update(d){
        if(!(data[col]||{})[id]) throw {code:"invalid_argument", message:"missing doc"};
        Object.assign(data[col][id], JSON.parse(JSON.stringify(d))); save(); emit(col);
      },
      async delete(){ if(data[col]) delete data[col][id]; save(); emit(col); }
    };
  }
  return {
    doc(path){
      const seg = path.split("/");
      return docRef(seg.slice(0,-1).join("/"), seg[seg.length-1]);
    },
    collection(col){
      return {
        path: col,
        doc(id){ return docRef(col, id || uid()); },
        onSnapshot(fn){
          (listeners[col] = listeners[col]||[]).push(fn);
          setTimeout(() => { try{ fn(snap(col)); }catch(e){} }, 0);
          return () => { const a = listeners[col]; const i = a.indexOf(fn); if(i>=0) a.splice(i,1); };
        }
      };
    }
  };
}

async function init(){
  renderShell();
  render();
  let real = null;
  try{
    if(FIREBASE_CONFIG && window.firebase){
      firebase.initializeApp(FIREBASE_CONFIG);
      auth = firebase.auth();
      // wait for any remembered session, then fall back to anonymous
      await new Promise(res => { const un = auth.onAuthStateChanged(() => { un(); res(); }); });
      if(!auth.currentUser) await auth.signInAnonymously();
      auth.onAuthStateChanged(u => {
        if(!u){ auth.signInAnonymously().catch(()=>{}); }
        const wasManager = isManager;
        isManager = !!(u && !u.isAnonymous);
        const chip = $("#mgrChip"); if(chip) chip.hidden = !isManager;
        if(db && (wasManager !== isManager || u)) subscribe(); // re-scope queries for the new access level
        render();
      });
      isManager = !!(auth.currentUser && !auth.currentUser.isAnonymous);
      $("#mgrChip").hidden = !isManager;
      real = firebase.firestore();
    }
  }catch(e){ real = null; }
  if(real){
    db = real;
  }else{
    db = makeLocalDb();
    offline = true;
    isManager = true; // demo mode: everything visible
    $("#mgrChip").hidden = false;
  }
  subscribe();
}

function subscribe(){
  unsubs.forEach(u => { try{ u(); }catch(e){} });
  unsubs = [];
  knownDecisionIds = null;
  knownClaimKeys = null;
  knownSwapOkIds = null;
  const uid = (!offline && auth && auth.currentUser) ? auth.currentUser.uid : null;
  const scoped = !offline && !isManager && uid; // employees: only their own docs
  const reqSrc = scoped ? db.collection("requests").where("ownerUid", "==", uid) : db.collection("requests");
  const decSrc = scoped ? db.collection("decisions").where("ownerUid", "==", uid) : db.collection("decisions");
  const onErr = e => {
    if(e && e.code === "revoked") showBanner("Your access to the shared board changed. Reload the page.");
  };
  unsubs.push(db.collection("meta").onSnapshot(s => {
    const d = s.docs.find(x => x.id === "daycounts");
    dayCounts = d && d.exists ? (d.data() || {}) : {};
    afterData();
  }, onErr));
  unsubs.push(reqSrc.onSnapshot(s => {
    requests = s.docs.filter(d => d.exists).map(d => ({ id: d.id, ...(d.data()||{}) }))
      .filter(r => DATE_RE.test(String(r.start)) && DATE_RE.test(String(r.end)));
    requests.sort((a,b) => String(a.start).localeCompare(String(b.start)) || String(a.createdAt||"").localeCompare(String(b.createdAt||"")));
    ready = true;
    afterData();
  }, onErr));
  unsubs.push(decSrc.onSnapshot(s => {
    const next = {};
    s.docs.forEach(d => { if(d.exists) next[d.id] = d.data()||{}; });
    // live toast + tracked ids for the notification feed
    if(knownDecisionIds){
      Object.keys(next).forEach(id => {
        if(!knownDecisionIds.has(id)){
          knownDecisionIds.add(id);
          const r = requests.find(x => x.id === id);
          if(r && me && r.name === me){
            const st = next[id].status === "approved" ? "approved ✅" : "denied ❌";
            toast("Your " + fmtRange(r) + " request was " + st);
          }
        }
      });
    }else{
      knownDecisionIds = new Set(Object.keys(next));
    }
    decisions = next;
    afterData();
  }, onErr));
  unsubs.push(db.collection("settings").onSnapshot(s => {
    const byWeek = {};
    s.docs.forEach(d => {
      if(!d.exists) return;
      if(d.id !== "schedule" && d.id.indexOf("schedule-") !== 0) return;
      const data = d.data() || {};
      if(!DATE_RE.test(String(data.weekStart)) || !Array.isArray(data.rows)) return;
      const entry = { ...data, docId: d.id };
      // prefer the per-week doc over the old single "schedule" doc for the same week
      if(!byWeek[data.weekStart] || d.id !== "schedule") byWeek[data.weekStart] = entry;
    });
    schedules = Object.values(byWeek).sort((a,b) => String(a.weekStart).localeCompare(String(b.weekStart)));
    afterData();
  }, onErr));
  unsubs.push(db.collection("shifts").onSnapshot(s => {
    shifts = s.docs.filter(d => d.exists).map(d => ({ id: d.id, ...(d.data()||{}) }))
      .filter(x => DATE_RE.test(String(x.date)));
    shifts.sort((a,b) => String(a.date).localeCompare(String(b.date)));
    if(knownClaimKeys){
      shifts.forEach(sh => {
        if(sh.claimedBy && !knownClaimKeys.has(sh.id) && me && sh.name === me){
          toast(cleanName(sh.claimedBy) + " picked up your " + fmtDay(sh.date) + " shift 🎉");
        }
        if(sh.claimedBy) knownClaimKeys.add(sh.id);
      });
    }else{
      knownClaimKeys = new Set(shifts.filter(x => x.claimedBy).map(x => x.id));
    }
    if(knownSwapOkIds){
      shifts.forEach(sh => {
        if(sh.approvedBy && !knownSwapOkIds.has(sh.id) && me && (sh.name === me || sh.claimedBy === me)){
          toast("Swap confirmed ✅ " + cleanName(sh.claimedBy) + " covers " + fmtDay(sh.date) + ".");
        }
        if(sh.approvedBy) knownSwapOkIds.add(sh.id);
      });
    }else{
      knownSwapOkIds = new Set(shifts.filter(x => x.approvedBy).map(x => x.id));
    }
    afterData();
  }, onErr));
}

function afterData(){ updateBadges(); render(); scheduleHeal(); }

// ---------- shared per-day counts (for busy-day flags without exposing names) ----------
function dayCountAll(ds){
  if(isManager || offline) return dayLoad(ds).length;
  return Math.max(dayCounts[ds] || 0, dayLoad(ds).length);
}
async function bumpDays(days, delta){
  // employees keep the shared counts fresh; manager clients rebuild them exactly
  if(offline || isManager || !days.length) return;
  try{
    const ref = db.doc("meta/daycounts");
    const snap = await ref.get();
    const m = (snap.exists && snap.data()) || {};
    days.forEach(d => { m[d] = Math.max(0, (m[d] || 0) + delta); if(!m[d]) delete m[d]; });
    await ref.set(m);
  }catch(e){}
}
function scheduleHeal(){
  // manager clients recompute the counts from the full data — self-corrects drift
  if(offline || !isManager || !db || !ready) return;
  clearTimeout(healT);
  healT = setTimeout(async () => {
    const m = {};
    activeRequests().forEach(r => expandDays(r.start, r.end).forEach(d => { m[d] = (m[d] || 0) + 1; }));
    const ka = Object.keys(m), kb = Object.keys(dayCounts);
    const same = ka.length === kb.length && ka.every(k => m[k] === dayCounts[k]);
    if(!same){ try{ await db.doc("meta/daycounts").set(m); }catch(e){} }
  }, 1500);
}

// ---------- derived data ----------
function roleOf(r){ return r.role === "Leadership" ? "Leadership" : "Budtender"; }
function statusOf(r){
  if(r.cancelled) return "cancelled";
  const d = decisions[r.id];
  if(d && (d.status === "approved" || d.status === "denied")) return d.status;
  return "pending";
}
function activeRequests(){ // pending + approved (things that occupy a day)
  return requests.filter(r => { const s = statusOf(r); return s === "pending" || s === "approved"; });
}
function dayLoad(dateStr){ // requests touching this day
  return activeRequests().filter(r => r.start <= dateStr && dateStr <= r.end);
}
function pendingList(){ return requests.filter(r => statusOf(r) === "pending"); }

function feedEvents(){
  const ev = [];
  requests.forEach(r => {
    if(r.createdAt) ev.push({ t:r.createdAt, kind:"request", r });
    const d = decisions[r.id];
    if(d && d.at) ev.push({ t:d.at, kind:d.status === "approved" ? "approved" : "denied", r, d });
  });
  shifts.forEach(s => {
    if(s.createdAt && !s.cancelled) ev.push({ t:s.createdAt, kind:"shiftOpen", s });
    if(s.claimedAt && s.claimedBy) ev.push({ t:s.claimedAt, kind:"shiftClaimed", s });
    if(s.approvedAt && s.approvedBy) ev.push({ t:s.approvedAt, kind:"swapOk", s });
  });
  ev.sort((a,b) => String(b.t).localeCompare(String(a.t)));
  return ev.slice(0, 40);
}
function unreadCount(){
  return feedEvents().filter(e => {
    const t = Date.parse(e.t);
    if(isNaN(t) || t <= lastSeen) return false;
    const author = e.kind === "request" ? e.r.name
      : e.kind === "shiftOpen" ? e.s.name
      : e.kind === "shiftClaimed" ? e.s.claimedBy
      : e.kind === "swapOk" ? e.s.approvedBy
      : (e.d && e.d.by);
    return !(me && author === me);
  }).length;
}
function updateBadges(){
  const n = unreadCount();
  const b = $("#bellBadge");
  b.hidden = n === 0;
  b.textContent = n > 9 ? "9+" : String(n);
  const p = pendingList().length;
  const pc = $("#pendCnt");
  pc.hidden = p === 0;
  pc.textContent = String(p);
}

function viewCalendar(){
  const first = new Date(calY, calM, 1);
  const startDow = first.getDay();
  const gridStart = new Date(calY, calM, 1 - startDow);
  const today = todayStr();
  let cells = "";
  for(let i = 0; i < 42; i++){
    const d = new Date(gridStart); d.setDate(gridStart.getDate() + i);
    const ds = dstr(d);
    const out = d.getMonth() !== calM;
    const load = dayLoad(ds);
    const total = dayCountAll(ds);
    const others = Math.max(0, total - load.length);
    const openShifts = shifts.filter(s => s.date === ds && !s.cancelled && !s.claimedBy);
    const hot = total >= HOT_THRESHOLD;
    const shown = load.slice(0,3);
    const extra = load.length - shown.length;
    cells += `<button class="day${out?" out":""}${ds===today?" today":""}${hot?" hot":""}" data-day="${ds}" aria-label="${esc(fmtDay(ds))}, ${total} request${total===1?"":"s"}">
      <span class="dn">${d.getDate()}</span>
      ${shown.map(r => `<span class="chip st-${statusOf(r)}">${esc(firstName(r.name))}${r.start===r.end && (r.dayPart==="half"||r.dayPart==="am"||r.dayPart==="pm") ? " ½" : r.start===r.end && r.dayPart==="custom" ? " ⏱" : ""}</span>`).join("")}
      ${extra > 0 ? `<span class="more">+${extra} more</span>` : ""}
      ${others > 0 ? `<span class="chip st-pending">${others} off</span>` : ""}
      ${openShifts.length ? `<span class="chip sh">↔ ${openShifts.length} shift${openShifts.length>1?"s":""}</span>` : ""}
    </button>`;
  }
  return `
  <div class="card">
    <div class="calhead">
      <h2>${MONTHS[calM]} ${calY}</h2>
      <button class="navbtn" id="cal-prev" aria-label="Previous month">‹</button>
      <button class="navbtn" id="cal-today">•</button>
      <button class="navbtn" id="cal-next" aria-label="Next month">›</button>

async function publishSchedule(){
  const week = document.getElementById("sc-week").value;
  if(!DATE_RE.test(week||"")){ toast("Pick the week's start date."); return; }
  const lines = document.getElementById("sc-text").value.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
  const rows = [];
  for(let i = 0; i < lines.length && rows.length < 60; i++){
    const sep = lines[i].includes("\t") ? "\t" : "|";
    const parts = lines[i].split(sep).map(c => c.trim());
    if(parts.length < 9){ toast("Line " + (i+1) + " needs 9 columns: name, role, then 7 days."); return; }
    rows.push({ name: cleanName(parts[0]), role: cleanText(parts[1], 30), shifts: parts.slice(2, 9).map(c => cleanText(c, 30)) });
  }
  if(!rows.length){ toast("Add at least one person."); return; }
  try{
    await db.doc("settings/schedule-" + week).set({ weekStart: week, rows, updatedAt: new Date().toISOString(), by: me || "Manager" });
    schedDraft = null; schedWeekDraft = null;
    selSchedWeek = week;
    toast("Week of " + fmtDay(week) + " published — the whole team sees it now.");
    render();
  }catch(e){ dbError(e, "Couldn't publish the schedule (manager access needed)"); }
}
async function deleteScheduleWeek(){
  const sched = currentSchedule();
  if(!sched.docId) return;
  if(!confirm("Remove the week of " + fmtDay(sched.weekStart) + " from the board?")) return;
  try{
    await db.doc("settings/" + sched.docId).delete();
    selSchedWeek = null;
    toast("Week removed.");
  }catch(e){ dbError(e, "Couldn't remove it (manager access needed)"); }
}

// ---------- schedule PDF import (pdf.js) ----------
let pdfjsReady = null;
function loadPdfJs(){
  if(window.pdfjsLib) return Promise.resolve();
  if(pdfjsReady) return pdfjsReady;
  pdfjsReady = new Promise((res, rej) => {
    const sc = document.createElement("script");
    sc.src = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js";
    sc.onload = () => {
      try{ pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js"; }catch(e){}
      res();
    };
    sc.onerror = () => { pdfjsReady = null; rej(new Error("pdf.js failed to load")); };
    document.head.appendChild(sc);
  });
  return pdfjsReady;
}
async function parseSchedulePdf(buf){
  await loadPdfJs();
  const pdf = await pdfjsLib.getDocument({ data: buf }).promise;
  const page = await pdf.getPage(1);
  const tc = await page.getTextContent();
  const items = tc.items
    .map(it => ({ s: String(it.str || "").trim(), x: it.transform[4], y: it.transform[5], w: it.width || 0 }))
    .filter(it => it.s);
  // week start: "MM/DD/YYYY – MM/DD/YYYY"
  let weekStart = null;
  for(const it of items){
    const m = it.s.match(/(\d{1,2})\/(\d{1,2})\/(\d{4})\s*[–—-]\s*\d{1,2}\/\d{1,2}\/\d{4}/);
    if(m){ weekStart = m[3] + "-" + String(m[1]).padStart(2,"0") + "-" + String(m[2]).padStart(2,"0"); break; }
  }
  // the 7 day-column headers give us the column positions
  const heads = items.filter(it => /^(SUN|MON|TUE|WED|THU|FRI|SAT)\b/i.test(it.s) && it.s.length <= 12)
    .sort((a,b) => a.x - b.x).slice(0, 7);
  if(heads.length < 7) throw new Error("day columns not found");
  const headY = heads[0].y;
  const centers = heads.map(h => h.x + h.w / 2);
  const nameColEnd = centers[0] - (centers[1] - centers[0]) / 2;
  const stopIt = items.find(it => /total\s*hours/i.test(it.s));
  const body = items.filter(it => it.y < headY - 4 && (!stopIt || it.y > stopIt.y + 4));
  // group into visual lines
  body.sort((a,b) => b.y - a.y || a.x - b.x);
  const lines = [];
  for(const it of body){
    const ln = lines[lines.length - 1];
    if(ln && Math.abs(ln.y - it.y) <= 3) ln.items.push(it);
    else lines.push({ y: it.y, items: [it] });
  }
  // people: name-column lines come in (name, role) pairs top-to-bottom
  const people = [];
  for(const ln of lines){
    const parts = ln.items.filter(it => it.x < nameColEnd).sort((a,b) => a.x - b.x);
    if(!parts.length) continue;
    const txt = parts.map(p => p.s).join(" ").replace(/\s+/g, " ").trim();
    if(!txt) continue;
    const last = people[people.length - 1];
    if(last && !last.role && (last.y - ln.y) <= 22){ last.role = txt; last.yBot = ln.y; }
    else people.push({ name: txt, role: "", y: ln.y, yBot: ln.y - 10, cells: [[],[],[],[],[],[],[]] });
  }
  if(!people.length) throw new Error("no team members found");
  // assign every day-column fragment to the nearest person block + column
  const mid = p => (p.y + p.yBot) / 2;
  for(const ln of lines){
    for(const it of ln.items){
      if(it.x < nameColEnd) continue;
      const cx = it.x + it.w / 2;
      let col = 0, bd = Infinity;
      for(let i = 0; i < 7; i++){ const d = Math.abs(cx - centers[i]); if(d < bd){ bd = d; col = i; } }
      let p = people[0], bp = Infinity;
      for(const q of people){ const d = Math.abs(ln.y - mid(q)); if(d < bp){ bp = d; p = q; } }
      p.cells[col].push({ x: it.x, s: it.s });
    }
  }
  const rows = people.map(p => ({
    name: cleanName(p.name),
    role: cleanText(p.role, 30),
    shifts: p.cells.map(c => cleanText(c.sort((a,b) => a.x - b.x).map(f => f.s).join(" ").replace(/\s+/g, " "), 30) || "Off")
  })).filter(r => r.name);
  return { weekStart, rows };
}
async function importSchedulePdf(file){
  toast("Reading the PDF…");
  try{
    const parsed = await parseSchedulePdf(await file.arrayBuffer());
    if(!parsed.rows.length) throw new Error("empty");
    schedDraft = serializeSchedule(parsed);
    if(parsed.weekStart) schedWeekDraft = parsed.weekStart;
    schedEditorOpen = true;
    render();
    toast("Read " + parsed.rows.length + " people from the PDF — check the rows, then Publish.");
  }catch(e){
    toast("Couldn't read that PDF — paste the rows in manually instead.");
  }
}

function reqCard(r, opts){
  opts = opts || {};
  const st = statusOf(r);
  const d = decisions[r.id];
  const mine = me && r.name === me;
  const canDecide = isManager && st === "pending";
  const canCancel = mine && !r.cancelled && st !== "denied" && r.end >= todayStr();
  const hotDays = expandDays(r.start, r.end).filter(day => dayCountAll(day) >= HOT_THRESHOLD);
  return `
  <div class="req${mine ? " mine":""}" data-req="${esc(r.id)}">
    <div class="top">
      <span class="who">${esc(r.name)}</span>
      <span class="pill ${roleOf(r) === "Leadership" ? "lead":"bud"}">${roleOf(r)}</span>
      <span class="pill ${r.type === "PTO" ? "pto":"uto"}">${r.type === "PTO" ? "PTO" : "Unpaid"}</span>
      <span class="pill ${st}">${st === "pending" ? "Pending" : st === "approved" ? "Approved" : st === "denied" ? "Denied" : "Cancelled"}</span>
      ${st === "pending" && hotDays.length ? `<span class="pill flag">⚠ busy day</span>` : ""}
    </div>
    <div class="dates">${esc(fmtRange(r))}</div>
    ${r.reason ? `<div class="reason">“${esc(r.reason)}”</div>` : ""}
    ${d && d.status ? `<div class="meta">${d.status === "approved" ? "Approved" : "Denied"} by ${esc(d.by || "manager")} ${ago(d.at)}${d.note ? ` — “${esc(d.note)}”` : ""}</div>`
      : `<div class="meta">Requested ${ago(r.createdAt)}</div>`}
    ${(canDecide || canCancel || (isManager && st !== "pending" && !r.cancelled)) ? `<div class="acts">
      ${canDecide ? `<button class="btn good sm" data-approve="${esc(r.id)}">Approve</button>
                     <button class="btn bad sm" data-deny="${esc(r.id)}">Deny</button>` : ""}
      ${isManager && (st === "approved" || st === "denied") ? `<button class="linkbtn" data-revert="${esc(r.id)}">Revert to pending</button>` : ""}
      ${canCancel ? `<button class="linkbtn" data-cancel="${esc(r.id)}">Cancel my request</button>` : ""}
    </div>` : ""}
    ${openNoteFor === r.id ? `<div class="notebox">
      <label for="note-${esc(r.id)}">Note to ${esc(firstName(r.name))} <span class="hint">(optional)</span></label>
      <input id="note-${esc(r.id)}" maxlength="200" placeholder="e.g. only 2 people scheduled that day">
      <div class="acts">
        <button class="btn ${openNoteKind === "deny" ? "bad" : "good"} sm" data-confirm="${esc(r.id)}">Confirm ${openNoteKind === "deny" ? "denial" : "approval"}</button>
        <button class="btn quiet sm" data-notecancel="1">Back</button>
      </div>
    </div>` : ""}
  </div>`;
}
let openNoteKind = "deny";
function viewRequests(){
  const today = todayStr();
  const match = r => {
    const st = statusOf(r);
    const visible = st !== "cancelled" || (me && r.name === me);
    if(reqFilter === "mine") return me && r.name === me;
    if(reqFilter === "pending") return st === "pending";
    if(reqFilter === "approved") return st === "approved";
    if(reqFilter === "denied") return st === "denied";
    if(reqFilter === "bud") return roleOf(r) === "Budtender" && visible;
    if(reqFilter === "lead") return roleOf(r) === "Leadership" && visible;
    return visible;
  };
  const list = requests.filter(match);
  const pending = list.filter(r => statusOf(r) === "pending");
  const upcoming = list.filter(r => statusOf(r) !== "pending" && r.end >= today);
  const past = list.filter(r => statusOf(r) !== "pending" && r.end < today);
  const fchip = (id, label) => `<button class="fchip" data-filter="${id}" aria-pressed="${reqFilter===id}">${label}</button>`;
  return `
  <div class="card">
    <h2>Time-off requests</h2>
    <p class="lead">${isManager ? "You're a manager here — you can approve or deny pending requests." : "You see only your own requests — managers see the whole team's."}</p>
    ${isManager ? `<div class="filters">
      ${fchip("all","All")}${fchip("mine","Mine")}${fchip("pending","Pending")}${fchip("approved","Approved")}${fchip("denied","Denied")}${fchip("bud","Budtenders")}${fchip("lead","Leadership")}
    </div>` : ""}
    <div class="sechead"><h3>Needs a decision</h3><span class="n">${pending.length}</span></div>
    ${pending.length ? pending.map(r => reqCard(r)).join("") : `<div class="empty">Nothing waiting. 🌤</div>`}
    <div class="sechead"><h3>Upcoming</h3><span class="n">${upcoming.length}</span></div>
    ${upcoming.length ? upcoming.map(r => reqCard(r)).join("") : `<div class="empty">No upcoming decided requests.</div>`}
    ${past.length ? `<details class="past"><summary>Past requests (${past.length})</summary>${past.slice(-60).reverse().map(r => reqCard(r)).join("")}</details>` : ""}
    ${isManager ? `<div class="mgrtools">
      <button class="btn quiet sm" id="exportCsv">⬇ Export CSV (payroll)</button>
      <span class="hint">Manager tools — you're signed in as a manager.</span>
    </div>` : ""}

}

// ---------- wiring ----------
function wire(root){
  // request form
  const fN = root.querySelector("#f-name");
  if(fN){
    const saveDraft = () => lsSet("sto.draft", form);
    fN.addEventListener("change", () => { setMe(cleanName(fN.value)); });
    root.querySelector("#f-type").addEventListener("change", e => { form.type = e.target.value === "PTO" ? "PTO" : "Unpaid"; saveDraft(); });
    root.querySelector("#f-role").addEventListener("change", e => { form.role = e.target.value === "Leadership" ? "Leadership" : "Budtender"; lsSet("sto.role", form.role); saveDraft(); });
    root.querySelector("#f-start").addEventListener("change", e => {
      form.start = e.target.value;
      if(!form.end || form.end < form.start) form.end = form.start;
      if(form.start !== form.end) form.dayPart = "full";
      saveDraft(); render();
    });
    root.querySelector("#f-end").addEventListener("change", e => {
      form.end = e.target.value;
      if(form.start && form.end < form.start) form.start = form.end;
      if(form.start !== form.end) form.dayPart = "full";
      saveDraft(); render();
    });
    root.querySelector("#f-part").addEventListener("click", e => {
      const b = e.target.closest("button[data-p]"); if(!b || b.disabled) return;
      form.dayPart = b.dataset.p; saveDraft(); render();
    });
    const fFrom = root.querySelector("#f-from"), fTo = root.querySelector("#f-to");
    if(fFrom) fFrom.addEventListener("change", e => { form.fromTime = e.target.value; saveDraft(); });
    if(fTo) fTo.addEventListener("change", e => { form.toTime = e.target.value; saveDraft(); });
    root.querySelector("#f-reason").addEventListener("input", e => { form.reason = e.target.value; saveDraft(); });
    root.querySelector("#f-submit").addEventListener("click", submitRequest);
  }
  // calendar
  const cp = root.querySelector("#cal-prev");
  if(cp){
    cp.addEventListener("click", () => { calM--; if(calM < 0){ calM = 11; calY--; } render(); });
    root.querySelector("#cal-next").addEventListener("click", () => { calM++; if(calM > 11){ calM = 0; calY++; } render(); });
    root.querySelector("#cal-today").addEventListener("click", () => { const n = new Date(); calY = n.getFullYear(); calM = n.getMonth(); render(); });
    root.querySelectorAll(".day").forEach(b => b.addEventListener("click", () => openDay(b.dataset.day)));
  }
  // requests
  root.querySelectorAll("[data-filter]").forEach(b => b.addEventListener("click", () => { reqFilter = b.dataset.filter; render(); }));
  root.querySelectorAll("[data-approve]").forEach(b => b.addEventListener("click", () => { openNoteFor = b.dataset.approve; openNoteKind = "approve"; render(); focusNote(); }));
  root.querySelectorAll("[data-deny]").forEach(b => b.addEventListener("click", () => { openNoteFor = b.dataset.deny; openNoteKind = "deny"; render(); focusNote(); }));
  root.querySelectorAll("[data-notecancel]").forEach(b => b.addEventListener("click", () => { openNoteFor = null; render(); }));
  root.querySelectorAll("[data-confirm]").forEach(b => b.addEventListener("click", () => decide(b.dataset.confirm, openNoteKind)));
  root.querySelectorAll("[data-revert]").forEach(b => b.addEventListener("click", () => revert(b.dataset.revert)));
  root.querySelectorAll("[data-cancel]").forEach(b => b.addEventListener("click", () => cancelRequest(b.dataset.cancel)));
  const ex = root.querySelector("#exportCsv");
  if(ex) ex.addEventListener("click", exportCsv);
  // schedule week navigation
  const scPrev = root.querySelector("#sc-prev");
  if(scPrev){
    const cur = currentSchedule();
    const idx = schedules.findIndex(s => s.weekStart === cur.weekStart);
    scPrev.addEventListener("click", () => { if(idx > 0){ selSchedWeek = schedules[idx-1].weekStart; render(); } });
    root.querySelector("#sc-next").addEventListener("click", () => { if(idx < schedules.length-1){ selSchedWeek = schedules[idx+1].weekStart; render(); } });
  }
  const scDel = root.querySelector("#sc-del");
  if(scDel) scDel.addEventListener("click", deleteScheduleWeek);
  // schedule editor
  const scp = root.querySelector("#sc-publish");
  if(scp){
    scp.addEventListener("click", publishSchedule);
    const scpdf = root.querySelector("#sc-pdf");
    if(scpdf) scpdf.addEventListener("change", e => {
      if(e.target.files && e.target.files[0]) importSchedulePdf(e.target.files[0]);
    });
    root.querySelector("#sc-editor").addEventListener("toggle", e => { schedEditorOpen = e.target.open; });
    root.querySelector("#sc-text").addEventListener("input", e => { schedDraft = e.target.value; });
    root.querySelector("#sc-week").addEventListener("change", e => { schedWeekDraft = e.target.value; });
  }
  // shifts
  const sp = root.querySelector("#s-post");
  if(sp){
    ["s-date","s-start","s-end","s-note"].forEach(id => {
      root.querySelector("#"+id).addEventListener("change", e => {
        if(id === "s-date") shiftForm.date = e.target.value;
        if(id === "s-start") shiftForm.startTime = e.target.value;
        if(id === "s-end") shiftForm.endTime = e.target.value;
        if(id === "s-note") shiftForm.note = e.target.value;
      });
    });
    sp.addEventListener("click", postShift);
  }
  root.querySelectorAll("[data-pickup]").forEach(b => b.addEventListener("click", () => pickupShift(b.dataset.pickup)));
  root.querySelectorAll("[data-unpost]").forEach(b => b.addEventListener("click", () => unpostShift(b.dataset.unpost)));
  root.querySelectorAll("[data-unclaim]").forEach(b => b.addEventListener("click", () => unclaimShift(b.dataset.unclaim)));
  root.querySelectorAll("[data-confirmswap]").forEach(b => b.addEventListener("click", () => confirmSwap(b.dataset.confirmswap)));
}
function focusNote(){
  const el = document.querySelector(".notebox input");
  if(el) el.focus();
}
function setMe(name){
  me = cleanName(name);
  lsSet("sto.me", me);
  refreshIdentity();
}

// ---------- actions ----------
function needName(){
  if(me) return false;
  toast("First, set your name (top right).");
  openIdentity();
  return true;
}
async function submitRequest(){
  const name = cleanName($("#f-name") ? $("#f-name").value : me);
  if(!name){ toast("Enter your name first."); return; }
  setMe(name);
  const start = form.start, end = form.end || form.start;
  if(!DATE_RE.test(start||"") || !DATE_RE.test(end||"")){ toast("Pick your dates."); return; }
  if(end < start){ toast("Last day can't be before first day."); return; }
  if(start < todayStr()){ toast("Requests need to be for today or later."); return; }
  const days = expandDays(start, end, 63);
  if(days.length > 31){ toast("Requests are limited to 31 days — split longer time off."); return; }
  const single = start === end;
  let dayPart = "full", fromTime = "", toTime = "";
  if(single && form.dayPart === "half") dayPart = "half";
  if(single && form.dayPart === "custom"){
    if(!TIME_RE.test(String(form.fromTime||"")) || !TIME_RE.test(String(form.toTime||""))){
      toast("Enter the custom from and until times."); return;
    }
    if(form.toTime <= form.fromTime){ toast("The until time must be after the from time."); return; }
    dayPart = "custom"; fromTime = form.fromTime; toTime = form.toTime;
  }
  const role = form.role === "Leadership" ? "Leadership" : "Budtender";
  lsSet("sto.role", role);
  const body = {
    name, type: form.type === "PTO" ? "PTO" : "Unpaid",
    role,
    start, end, dayPart, fromTime, toTime,
    reason: cleanText(form.reason, 300),
    createdAt: new Date().toISOString(),
    cancelled: false,
    ownerUid: (!offline && auth && auth.currentUser) ? auth.currentUser.uid : "local"
  };
  const btn = $("#f-submit"); if(btn){ btn.disabled = true; btn.textContent = "Submitting…"; }
  try{
    await db.doc("requests/" + uid()).set(body);
    bumpDays(days, +1);
    form = { type: form.type, role, start:"", end:"", dayPart:"full", fromTime:"", toTime:"", reason:"" };
    lsSet("sto.draft", form);
    toast("Request submitted ☀️ Managers have been queued.");
    curTab = "requests"; reqFilter = "mine";
    $$(".tab").forEach(t => t.setAttribute("aria-selected", String(t.dataset.tab === "requests")));
    render();
  }catch(e){
    if(btn){ btn.disabled = false; btn.textContent = "Submit request"; }
    dbError(e, "Couldn't submit the request");
  }
}
async function decide(id, kind){
  const r = requests.find(x => x.id === id); if(!r) return;
  const noteEl = document.getElementById("note-" + id);
  const note = cleanText(noteEl ? noteEl.value : "", 200);
  const body = { status: kind === "approve" ? "approved" : "denied", note, by: me || "Manager", at: new Date().toISOString(), ownerUid: r.ownerUid || "" };
  try{
    openNoteFor = null;
    await db.doc("decisions/" + id).set(body);
    toast((kind === "approve" ? "Approved" : "Denied") + " — " + firstName(r.name) + " will see it.");
    render();
  }catch(e){ dbError(e, "Couldn't save the decision (manager access needed)"); }
}
async function revert(id){
  try{ await db.doc("decisions/" + id).delete(); toast("Back to pending."); }
  catch(e){ dbError(e, "Couldn't revert"); }
}
async function cancelRequest(id){
  const r = requests.find(x => x.id === id); if(!r) return;
  if(!confirm("Cancel your " + fmtRange(r) + " request?")) return;
  try{
    await db.doc("requests/" + id).update({ cancelled: true, cancelledAt: new Date().toISOString() });
    bumpDays(expandDays(r.start, r.end), -1);
    toast("Request cancelled.");
  }
  catch(e){ dbError(e, "Couldn't cancel"); }
}
async function postShift(){
  if(needName()) return;
  const { date, startTime, endTime } = shiftForm;
  if(!DATE_RE.test(date||"")){ toast("Pick the shift date."); return; }
  if(date < todayStr()){ toast("That shift is in the past."); return; }
  if(!TIME_RE.test(startTime||"") || !TIME_RE.test(endTime||"")){ toast("Enter the shift start and end times."); return; }
  const body = {
    name: me, date,
    startTime, endTime,
    note: cleanText(shiftForm.note, 200),
    createdAt: new Date().toISOString(),
    cancelled: false, claimedBy: "", claimedAt: ""
  };
  try{
    await db.doc("shifts/" + uid()).set(body);
    shiftForm = { date:"", startTime:"", endTime:"", note:"" };
    toast("Shift posted — the team can see it now.");
    render();
  }catch(e){ dbError(e, "Couldn't post the shift"); }
}
async function pickupShift(id){
  if(needName()) return;
  const s = shifts.find(x => x.id === id); if(!s || s.claimedBy) return;
  if(!confirm("Take " + firstName(s.name) + "'s " + fmtDay(s.date) + " shift (" + fmtTime(s.startTime) + "–" + fmtTime(s.endTime) + ")?")) return;
  try{
    await db.doc("shifts/" + id).update({ claimedBy: me, claimedAt: new Date().toISOString() });
    toast("You picked it up 🙌 A manager still confirms the schedule change.");
  }catch(e){ dbError(e, "Couldn't pick up the shift"); }
}
async function unpostShift(id){
  try{ await db.doc("shifts/" + id).update({ cancelled: true }); toast("Shift taken down."); }
  catch(e){ dbError(e, "Couldn't remove it"); }
}
async function unclaimShift(id){
  try{ await db.doc("shifts/" + id).update({ claimedBy: "", claimedAt: "", approvedBy: "", approvedAt: "" }); toast("Pickup undone — shift is open again."); }
  catch(e){ dbError(e, "Couldn't undo"); }
}
async function confirmSwap(id){
  const s = shifts.find(x => x.id === id); if(!s || !s.claimedBy) return;
  try{
    await db.doc("shifts/" + id).update({ approvedBy: me || "Manager", approvedAt: new Date().toISOString() });
    toast("Swap confirmed — " + firstName(s.claimedBy) + " officially covers " + fmtDay(s.date) + ".");
  }catch(e){ dbError(e, "Couldn't confirm the swap (manager access needed)"); }
}
function dbError(e, what){
  const code = e && e.code;
  if(code === "permission-denied"){ toast(what + ": manager sign-in required."); return; }
  if(code === "quota_exceeded"){ toast(what + ": the board is full — ask a manager to export + clear old requests."); return; }
  if(code === "resource_exhausted"){ toast(what + ": too many changes at once — wait a moment and retry."); return; }
  if(code === "invalid_argument"){ toast(what + "."); return; }
  toast(what + " — check your connection and try again.");
}

// ---------- CSV export ----------
async function exportCsv(){
  const csvCell = v => {
    const s = String(v == null ? "" : v);
    // guard against spreadsheet formula injection + quote correctly
    const safe = /^[=+\-@\t\r]/.test(s) ? "'" + s : s;
    return '"' + safe.replace(/"/g,'""') + '"';
  };
  const rows = [["Employee","Role","Type","First day","Last day","Day part","Status","Reason","Decided by","Decision note","Requested at","Decided at"]];
  requests.forEach(r => {
    const d = decisions[r.id] || {};
    rows.push([r.name, roleOf(r), r.type, r.start, r.end,
      r.dayPart === "am" ? "AM half" : r.dayPart === "pm" ? "PM half"
        : r.dayPart === "half" ? "Half day"
        : r.dayPart === "custom" ? "Custom " + (r.fromTime || "?") + "-" + (r.toTime || "?")
        : "Full",
      statusOf(r), r.reason || "", d.by || "", d.note || "", r.createdAt || "", d.at || ""]);
  });
  const csv = rows.map(row => row.map(csvCell).join(",")).join("\r\n");
  const blob = new Blob(["﻿" + csv], { type: "text/csv;charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "sunburn-timeoff-" + todayStr() + ".csv";
  document.body.appendChild(a);
  a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 2000);
  toast("CSV downloaded.");
}

// ---------- sheets (identity / notifications / day detail) ----------
function sheet(innerHtml, onwire){
  const ov = document.createElement("div");
  ov.className = "overlay";
  ov.innerHTML = `<div class="sheet" role="dialog" aria-modal="true">
    <button class="close" aria-label="Close">✕</button>${innerHtml}</div>`;
  ov.addEventListener("click", e => { if(e.target === ov) ov.remove(); });
  ov.querySelector(".close").addEventListener("click", () => ov.remove());
  document.body.appendChild(ov);
  if(onwire) onwire(ov);
  return ov;
}
function openIdentity(){
  const mgrEmail = auth && auth.currentUser && !auth.currentUser.isAnonymous ? (auth.currentUser.email || "manager") : "";
  const ov = sheet(`
    <h2>Who are you?</h2>
    <p class="lead" style="color:var(--muted); font-size:13.5px; margin:0 0 12px">
      Your name goes on your requests and shift posts, and is remembered on this device.</p>
    <div class="field">
      <label for="id-input">Your name</label>
      <input id="id-input" list="names" maxlength="40" value="${esc(me)}" placeholder="First and last name">
    </div>
    <button class="btn primary" id="id-save" style="width:100%">Save</button>
    ${offline || !auth ? "" : (mgrEmail ? `
    <div class="banner info" style="margin-top:16px; margin-bottom:0"><span>🔑</span>
      <div>Manager: signed in as <b>${esc(mgrEmail)}</b>.
      <button class="linkbtn" id="mgr-signout">Sign out</button></div></div>` : `
    <details style="margin-top:16px">
      <summary class="hint" style="cursor:pointer; font-weight:600">Manager sign-in</summary>
      <div class="field" style="margin-top:10px">
        <label for="mgr-email">Manager email</label>
        <input id="mgr-email" type="email" autocomplete="username" placeholder="you@example.com">
      </div>
      <div class="field">
        <label for="mgr-pw">Password</label>
        <input id="mgr-pw" type="password" autocomplete="current-password">
      </div>
      <button class="btn quiet" id="mgr-signin" style="width:100%">Sign in as manager</button>
    </details>`)}
  `, ov => {
    const inp = ov.querySelector("#id-input");
    inp.focus();
    const save = () => {
      const v = cleanName(inp.value);
      if(!v){ inp.focus(); return; }
      setMe(v); ov.remove(); render();
    };
    ov.querySelector("#id-save").addEventListener("click", save);
    inp.addEventListener("keydown", e => { if(e.key === "Enter") save(); });
    const si = ov.querySelector("#mgr-signin");
    if(si) si.addEventListener("click", async () => {
      const em = ov.querySelector("#mgr-email").value.trim();
      const pw = ov.querySelector("#mgr-pw").value;
      if(!em || !pw){ toast("Enter the manager email and password."); return; }
      si.disabled = true; si.textContent = "Signing in…";
      try{
        await auth.signInWithEmailAndPassword(em, pw);
        ov.remove();
        toast("Signed in — manager tools unlocked.");
      }catch(e){
        si.disabled = false; si.textContent = "Sign in as manager";
        toast("Sign-in failed — check the email and password.");
      }
    });
    const so = ov.querySelector("#mgr-signout");
    if(so) so.addEventListener("click", async () => {
      try{ await auth.signOut(); }catch(e){}
      ov.remove();
      toast("Signed out of manager mode.");
    });
  });
}
function openNotifications(){
  const evs = feedEvents();
  const item = e => {
    const t = Date.parse(e.t);
    const unread = !isNaN(t) && t > lastSeen;
    let ic = "🔔", cls = "request", txt = "";
    if(e.kind === "approved"){ ic = "✅"; cls = "approved"; txt = `<b>${esc(firstName(e.r.name))}</b>'s ${esc(fmtRange(e.r))} request was <b>approved</b>${e.d.by ? " by " + esc(e.d.by) : ""}${e.d.note ? ` — “${esc(e.d.note)}”` : ""}`; }
    else if(e.kind === "denied"){ ic = "❌"; cls = "denied"; txt = `<b>${esc(firstName(e.r.name))}</b>'s ${esc(fmtRange(e.r))} request was <b>denied</b>${e.d.by ? " by " + esc(e.d.by) : ""}${e.d.note ? ` — “${esc(e.d.note)}”` : ""}`; }
    else if(e.kind === "request"){ ic = "📅"; cls = "request"; txt = `<b>${esc(e.r.name)}</b> requested ${esc(e.r.type === "PTO" ? "PTO" : "unpaid time off")}: ${esc(fmtRange(e.r))}`; }
    else if(e.kind === "shiftOpen"){ ic = "↔"; cls = "shift"; txt = `<b>${esc(e.s.name)}</b> offered up their ${esc(fmtDay(e.s.date))} shift (${esc(fmtTime(e.s.startTime))}–${esc(fmtTime(e.s.endTime))})`; }
    else if(e.kind === "shiftClaimed"){ ic = "🤝"; cls = "shift"; txt = `<b>${esc(e.s.claimedBy)}</b> picked up <b>${esc(firstName(e.s.name))}</b>'s ${esc(fmtDay(e.s.date))} shift — waiting on a manager`; }
    else if(e.kind === "swapOk"){ ic = "✅"; cls = "approved"; txt = `<b>${esc(e.s.approvedBy)}</b> confirmed the swap: <b>${esc(firstName(e.s.claimedBy))}</b> covers <b>${esc(firstName(e.s.name))}</b>'s ${esc(fmtDay(e.s.date))} shift`; }
    return `<div class="notif${unread ? " unread":""}"><span class="ic ${cls}">${ic}</span><div>${txt}<div class="when">${esc(ago(e.t))}</div></div></div>`;
  };
  sheet(`
    <h2>What's new</h2>
    ${evs.length ? evs.map(item).join("") : `<div class="empty">Nothing yet — it'll fill up as the team uses the board.</div>`}
  `);
  lastSeen = Date.now();
  lsSet("sto.lastSeen", lastSeen);
  updateBadges();
}
function openDay(ds){
  const load = requests.filter(r => statusOf(r) !== "cancelled" && r.start <= ds && ds <= r.end);
  const dayShifts = shifts.filter(s => s.date === ds && !s.cancelled);
  const active = load.filter(r => statusOf(r) !== "denied");
  const onSched = scheduledFor(ds);
  const total = dayCountAll(ds);
  const hiddenOthers = !isManager && !offline ? Math.max(0, total - load.length) : 0;
  sheet(`
    <h2>${esc(fmtDay(ds))}</h2>
    ${onSched && onSched.length ? `<div class="banner info" style="display:block"><b>On the schedule (${onSched.length}):</b> ${
      onSched.map(x => esc(firstName(x.name)) + " " + esc(x.cell)).join(" · ")}</div>` : ""}
    ${total >= HOT_THRESHOLD ? `<div class="banner warn"><span>⚠️</span><div><b>Busy day:</b> ${total} time-off request${total===1?"":"s"}. New requests for this day may be denied for coverage.</div></div>` : ""}
    ${hiddenOthers > 0 ? `<div class="banner info"><span>👥</span><div>${hiddenOthers} teammate${hiddenOthers===1?" has":"s have"} time off this day. Names are only visible to managers.</div></div>` : ""}
    ${load.length ? load.map(r => reqCard(r)).join("") : `<div class="empty">${isManager || offline ? "No time-off requests this day." : "You have no requests this day."}</div>`}
    ${dayShifts.length ? `<div class="sechead"><h3>Shifts</h3></div>` + dayShifts.map(s => `
      <div class="shift"><div class="top"><span style="font-weight:700">${esc(s.name)}</span>
      <span class="pill ${s.claimedBy ? "claimed":"open"}">${s.claimedBy ? "Covered by " + esc(s.claimedBy) : "Up for grabs"}</span></div>
      <div class="dates">${esc(fmtTime(s.startTime))}–${esc(fmtTime(s.endTime))}</div></div>`).join("") : ""}
  `, ov => {
    // approve/deny inside the sheet routes through the main handlers
    ov.querySelectorAll("[data-approve],[data-deny],[data-cancel],[data-revert]").forEach(b => {
      b.addEventListener("click", () => { ov.remove();
        curTab = "requests";
        $$(".tab").forEach(t => t.setAttribute("aria-selected", String(t.dataset.tab === "requests")));
        if(b.dataset.approve){ openNoteFor = b.dataset.approve; openNoteKind = "approve"; }
        if(b.dataset.deny){ openNoteFor = b.dataset.deny; openNoteKind = "deny"; }
        if(b.dataset.cancel) cancelRequest(b.dataset.cancel);
        if(b.dataset.revert) revert(b.dataset.revert);
        render(); focusNote();
      });
    });
  });
}

init();
</script>
